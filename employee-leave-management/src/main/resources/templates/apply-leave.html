<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Apply for Leave</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container" style="max-width: 600px; margin-top: 3rem;">
        <div class="card">
            <h2>Apply for Leave</h2>
            <form th:action="@{/employee/apply-leave}" th:object="${leaveRequest}" method="post">
                <div class="form-group">
                    <label>Leave Type:</label>
                    <select th:field="*{leaveType}">
                        <option th:each="type : ${leaveTypes}" th:value="${type}" th:text="${type}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Start Date:</label>
                    <input type="date" th:field="*{startDate}" required>
                </div>
                <div class="form-group">
                    <label>End Date:</label>
                    <input type="date" th:field="*{endDate}" required>
                </div>
                <div class="form-group">
                    <label>Reason:</label>
                    <textarea th:field="*{reason}" rows="4" required></textarea>
                </div>
                <div style="display: flex; gap: 1rem;">
                    <button type="submit" class="btn btn-primary">Submit Request</button>
                    <a th:href="@{/employee/dashboard}" class="btn" style="background-color: #7f8c8d; color: white;">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
