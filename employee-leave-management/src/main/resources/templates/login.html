<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Leave Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container" style="max-width: 450px; margin-top: 5rem;">
        <div class="card">
            <h2 style="text-align: center; margin-bottom: 1.5rem;">System Login</h2>
            <div th:if="${error}" style="color: red; margin-bottom: 1rem; text-align: center;" th:text="${error}"></div>
            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label>Email Address:</label>
                    <input type="email" name="email" required placeholder="user@company.com">
                </div>
                <div class="form-group">
                    <label>Password:</label>
                    <input type="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In</button>
            </form>
        </div>
    </div>
</body>
</html>
